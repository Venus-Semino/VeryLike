name: CI VeryLike

on:
  push:
    branches: [ "main", "pipeline-ci" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout del código
      uses: actions/checkout@v4

    - name: Configurar .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Limpiar archivos temporales locales antiguos
      run: |
        find . -type d \( -name "obj" -o -name "bin" \) -exec rm -rf {} +

    - name: Restaurar dependencias
      run: dotnet restore VeryLike/VeryLike.Web.csproj

    - name: Compilar proyecto principal
      run: dotnet build VeryLike/VeryLike.Web.csproj --no-restore
