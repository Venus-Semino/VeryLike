name: CI VeryLike

on:
  push:
    branches: [ "main", "master", "pipeline-ci" ]
  pull_request:
    branches: [ "main", "master", "pipeline-ci" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restaurar dependencias
        run: |
          dotnet restore VeryLike.Web.csproj
          dotnet restore VeryLike.Catalog.API/VeryLike.Catalog.API.csproj
          dotnet restore VeryLike.Forum.API/VeryLike.Forum.API.csproj
          
      - name: Compilar aplicación Web
        run: dotnet build VeryLike.Web.csproj --no-restore --configuration Release

      - name: Compilar microservicios
        run: |
          dotnet build VeryLike.Catalog.API/VeryLike.Catalog.API.csproj --configuration Release --no-restore
          dotnet build VeryLike.Forum.API/VeryLike.Forum.API.csproj --configuration Release --no-restore
