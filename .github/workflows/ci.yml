name: VeryLike CI Pipeline

on:
  push:
    branches: [ "main", "pipeline-ci" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout del código
      uses: actions/checkout@v3

    - name: Configurar .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '10.0.x' 

    - name: Restaurar dependencias
      run: dotnet restore

    - name: Compilar proyecto
      run: dotnet build VeryLike.Web.csproj --no-restore

    - name: Ejecutar Pruebas Automatizadas
      run: dotnet test VeryLike.Tests/VeryLike.Tests.csproj --verbosity normal
